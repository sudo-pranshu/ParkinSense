name: ParkinSense CI

on:
  push:
    branches: [ "develop", "main", "transform/**" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[live,dashboard,dev]"
    - name: Lint (errors only)
      run: flake8 parkinsense tests benchmarks --count --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics
    - name: Tests (hardware tests are skipped)
      run: pytest -q
    - name: Synthetic benchmark smoke run
      run: python -m benchmarks.run_benchmarks --impl current --only cost --out /tmp/bench.json

  firmware:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Host unit tests for packet/scheduler logic
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -I firmware/parkinsense_wearable firmware/tests/test_packet.cpp -o /tmp/t
        /tmp/t
    - name: Sketch type-check against API stubs (not a substitute for the nRF52 toolchain)
      run: |
        cp firmware/parkinsense_wearable/parkinsense_wearable.ino /tmp/sketch.cpp
        g++ -std=c++17 -Wall -Wextra -fsyntax-only -I firmware/tests/stubs -I firmware/parkinsense_wearable /tmp/sketch.cpp
